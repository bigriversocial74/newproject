name: VP3 Retained Certification

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vp3-retained-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VP3_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Composer manifest
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 validate --strict --no-check-publish
      - name: Validate PHP ${{ matrix.php }}, JavaScript and retained contracts
        run: |
          for file in public/assets/*.js; do node --check "$file"; done
          docker run --rm -e VP3_RELEASE_COMMIT="$VP3_RELEASE_COMMIT" -v "$PWD:/app" -w /app php:${{ matrix.php }}-cli-bookworm sh -lc '
            apt-get update >/dev/null &&
            apt-get install -y --no-install-recommends libonig-dev libzip-dev >/dev/null &&
            docker-php-ext-install -j2 pdo_mysql mbstring zip >/dev/null &&
            php -r '\''$required = ["pdo", "pdo_mysql", "json", "mbstring", "openssl", "sodium", "zip"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'\'' &&
            find src public tests config workers tools -name "*.php" -print0 | xargs -0 -n1 php -l &&
            php tools/build-single-install.php &&
            php tests/run.php &&
            php tests/phase3_contract.php &&
            php tests/phase4_contract.php &&
            php tests/phase5_contract.php &&
            php tests/phase6_contract.php &&
            php tests/phase7_contract.php &&
            php tests/phase8_contract.php &&
            php tests/phase9_contract.php &&
            php tests/phase10_contract.php &&
            php tests/phase11a_contract.php &&
            php tests/phase11a_runtime.php &&
            php tests/phase11b_contract.php &&
            php tests/phase11b_runtime.php &&
            php tests/phase11c_contract.php &&
            php tests/phase11c_runtime.php &&
            php tests/phase11c_extended_contract.php &&
            php tests/phase11c_notifications_runtime.php &&
            php tests/phase11c_update_contract.php &&
            php tests/phase12_homeserver_control_plane_contract.php &&
            php tests/phase13_homeserver_cutover_contract.php &&
            php tests/phase14_homeserver_fleet_contract.php &&
            php tests/phase15_control_center_contract.php &&
            php tests/phase15_federated_settings_contract.php &&
            php tests/phase16_billing_control_center_contract.php &&
            php tests/phase17_account_team_security_contract.php &&
            php tests/phase18_operations_control_center_contract.php &&
            php tests/phase19_recovery_control_center_contract.php &&
            php tests/phase20_infrastructure_control_center_contract.php &&
            php tests/phase21_domain_pod_lifecycle_contract.php &&
            php tests/phase22_federated_settings_control_center_contract.php &&
            php tests/phase23_public_account_routing_contract.php &&
            php tests/phase24_public_license_activation_contract.php &&
            php tests/phase25_public_response_boundary_contract.php &&
            php tests/phase26_public_navigation_redirects_contract.php &&
            php tests/phase27_public_authentication_response_contract.php &&
            php tests/phase28_auth_request_session_transport_contract.php &&
            php tests/phase29_browser_request_integrity_contract.php &&
            php tests/phase30_security_audit_hardening_contract.php &&
            php tests/phase31_security_center_contract.php &&
            php tests/phase32_security_incident_automation_contract.php &&
            php tests/phase33_production_deployment_contract.php &&
            php tests/phase33_operator_controls_contract.php &&
            php tests/phase34_release_deployment_control_center_contract.php &&
            php tests/phase35_platform_reliability_slo_status_center_contract.php
          '
      - name: Verify committed standalone cumulative SQL installer
        run: git diff --exit-code -- database/vp3-single-install.sql

  mysql8:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native PHP and MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring php-zip mysql-client
          php -r '$required = ["pdo", "pdo_mysql", "json", "mbstring", "openssl", "sodium", "zip"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'
      - name: Verify and import standalone installer twice
        run: |
          php tools/build-single-install.php
          git diff --exit-code -- database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
      - name: Run retained Phase 2 through Phase 35 database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_MYSQL_BINARY: /usr/bin/mysql
          VP3_TEST_MYSQLDUMP_BINARY: /usr/bin/mysqldump
        run: |
          php tests/database-integration.php
          php tests/phase3_database_integration.php
          php tests/phase5_database_integration.php
          php tests/phase9_database_integration.php
          php tests/phase10_database_integration.php
          php tests/phase12_homeserver_control_plane_database_integration.php
          php tests/phase14_homeserver_fleet_database_integration.php
          php tests/phase15_control_center_database_integration.php
          php tests/phase15_federated_settings_database_integration.php
          php tests/phase16_billing_control_center_database_integration.php
          php tests/phase17_account_team_security_database_integration.php
          php tests/phase17_invitation_revocation_database_integration.php
          php tests/phase18_operations_control_center_database_integration.php
          php tests/phase19_recovery_control_center_database_integration.php
          php tests/phase20_infrastructure_control_center_database_integration.php
          php tests/phase20_infrastructure_stale_role_database_integration.php
          php tests/phase21_nested_transaction_database_integration.php
          php tests/phase21_domain_pod_lifecycle_database_integration.php
          php tests/phase21_failed_pod_rollback_database_integration.php
          php tests/phase22_federated_settings_control_center_database_integration.php
          php tests/phase23_public_account_routing_database_integration.php
          php tests/phase24_public_license_activation_database_integration.php
          php tests/phase25_public_response_boundary_database_integration.php
          php tests/phase26_public_navigation_redirects_database_integration.php
          php tests/phase27_public_authentication_response_database_integration.php
          php tests/phase28_auth_request_session_transport_database_integration.php
          php tests/phase29_browser_request_integrity_database_integration.php
          php tests/phase30_security_audit_hardening_database_integration.php
          php tests/phase32_security_incident_automation_database_integration.php
          php tests/phase32_security_operations_database_integration.php
          php tests/phase32_assignment_replay_database_integration.php
          php tests/phase33_production_deployment_database_integration.php
          php tests/phase33_operator_controls_database_integration.php
          php tests/phase34_release_deployment_control_center_database_integration.php
          php tests/phase35_platform_reliability_slo_status_center_database_integration.php

  mariadb1011:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native PHP and MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring php-zip mariadb-client
          php -r '$required = ["pdo", "pdo_mysql", "json", "mbstring", "openssl", "sodium", "zip"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'
      - name: Verify and import standalone installer twice
        run: |
          php tools/build-single-install.php
          git diff --exit-code -- database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
      - name: Run retained Phase 2 through Phase 35 database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_MYSQL_BINARY: /usr/bin/mariadb
          VP3_TEST_MYSQLDUMP_BINARY: /usr/bin/mariadb-dump
        run: |
          php tests/database-integration.php
          php tests/phase3_database_integration.php
          php tests/phase5_database_integration.php
          php tests/phase9_database_integration.php
          php tests/phase10_database_integration.php
          php tests/phase12_homeserver_control_plane_database_integration.php
          php tests/phase14_homeserver_fleet_database_integration.php
          php tests/phase15_control_center_database_integration.php
          php tests/phase15_federated_settings_database_integration.php
          php tests/phase16_billing_control_center_database_integration.php
          php tests/phase17_account_team_security_database_integration.php
          php tests/phase17_invitation_revocation_database_integration.php
          php tests/phase18_operations_control_center_database_integration.php
          php tests/phase19_recovery_control_center_database_integration.php
          php tests/phase20_infrastructure_control_center_database_integration.php
          php tests/phase20_infrastructure_stale_role_database_integration.php
          php tests/phase21_nested_transaction_database_integration.php
          php tests/phase21_domain_pod_lifecycle_database_integration.php
          php tests/phase21_failed_pod_rollback_database_integration.php
          php tests/phase22_federated_settings_control_center_database_integration.php
          php tests/phase23_public_account_routing_database_integration.php
          php tests/phase24_public_license_activation_database_integration.php
          php tests/phase25_public_response_boundary_database_integration.php
          php tests/phase26_public_navigation_redirects_database_integration.php
          php tests/phase27_public_authentication_response_database_integration.php
          php tests/phase28_auth_request_session_transport_database_integration.php
          php tests/phase29_browser_request_integrity_database_integration.php
          php tests/phase30_security_audit_hardening_database_integration.php
          php tests/phase32_security_incident_automation_database_integration.php
          php tests/phase32_security_operations_database_integration.php
          php tests/phase32_assignment_replay_database_integration.php
          php tests/phase33_production_deployment_database_integration.php
          php tests/phase33_operator_controls_database_integration.php
          php tests/phase34_release_deployment_control_center_database_integration.php
          php tests/phase35_platform_reliability_slo_status_center_database_integration.php
