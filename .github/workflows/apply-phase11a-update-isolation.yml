name: Apply Phase 11A Update Isolation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/vp3-phase-11a-runtime-queue-hardening-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-11a-runtime-queue-hardening-20260729
          fetch-depth: 0
      - name: Apply isolated update fixture
        run: |
          base64 -d .phase11a-update-isolation/payload.b64 | gzip -d > /tmp/phase11a-update-isolation.patch
          git apply --check /tmp/phase11a-update-isolation.patch
          git apply /tmp/phase11a-update-isolation.patch
          rm -rf .phase11a-update-isolation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate Phase 11A update recovery test"
          git push origin HEAD:feature/vp3-phase-11a-runtime-queue-hardening-20260729
