name: Phase 11C Phase 12 Compatibility

on:
  push:
    branches:
      - feature/vp3-phase-11c-production-adapters
      - feature/vp3-phase-11c-production-adapters-rebased
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: phase11c-phase12-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, mbstring, openssl, sodium, zip
          coverage: none
      - id: phase12
        continue-on-error: true
        run: php tests/phase12_homeserver_control_plane_contract.php
      - name: Publish Phase 12 PHP compatibility
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.php }}
          OUTCOME: ${{ steps.phase12.outcome }}
        run: bash .github/scripts/publish-commit-status.sh "phase11c/phase12/php-${VERSION}" "$OUTCOME" "Phase 11C retains Phase 12 on PHP ${VERSION}"
      - name: Enforce Phase 12 PHP compatibility
        if: always()
        env:
          OUTCOME: ${{ steps.phase12.outcome }}
        run: '[[ "$OUTCOME" == success ]]'

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, openssl, sodium, zip
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - id: phase12
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
          php tests/phase12_homeserver_control_plane_database_integration.php
      - name: Publish Phase 12 MySQL compatibility
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.phase12.outcome }}
        run: bash .github/scripts/publish-commit-status.sh "phase11c/phase12/mysql8" "$OUTCOME" "Phase 11C retains Phase 12 on MySQL 8"
      - name: Enforce Phase 12 MySQL compatibility
        if: always()
        env:
          OUTCOME: ${{ steps.phase12.outcome }}
        run: '[[ "$OUTCOME" == success ]]'

  mariadb1011:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, openssl, sodium, zip
          coverage: none
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - id: phase12
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
          php tests/phase12_homeserver_control_plane_database_integration.php
      - name: Publish Phase 12 MariaDB compatibility
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.phase12.outcome }}
        run: bash .github/scripts/publish-commit-status.sh "phase11c/phase12/mariadb1011" "$OUTCOME" "Phase 11C retains Phase 12 on MariaDB 10.11"
      - name: Enforce Phase 12 MariaDB compatibility
        if: always()
        env:
          OUTCOME: ${{ steps.phase12.outcome }}
        run: '[[ "$OUTCOME" == success ]]'
