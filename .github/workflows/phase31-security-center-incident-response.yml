name: Phase 31 Security Center and Incident Response (Retained)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run retained Phase 31 contract
        run: |
          docker run --rm -v "$PWD:/app" -w /app php:8.3-cli-bookworm sh -lc '
            php -l src/ControlCenter/SecurityCenterQueryService.php &&
            php -l public/security-center.php &&
            php -l public/api/control-center/v1/security-center-overview.php &&
            php tests/phase31_security_center_contract.php
          '
