name: Phase 12 HomeServer Control Plane

on:
  push:
    branches:
      - main
      - feature/vp3-homeserver-control-plane-v1-20260729
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase12-homeserver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.ref == 'refs/heads/feature/vp3-homeserver-control-plane-v1-20260729' || github.head_ref == 'feature/vp3-homeserver-control-plane-v1-20260729' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-homeserver-control-plane-v1-20260729
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Apply idempotent software-authority repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/HomeServers/HomeServerControlPlaneService.php')
          text = path.read_text()
          old_call = "$this->revokeDeviceAuthority($pdo, (int) $device['id']);"
          new_call = "$this->revokeSoftwareAuthority($pdo, (int) $device['id']);"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('Suspension authority call was not found')
          marker = "    private function revokeDeviceAuthority(PDO $pdo, int $deviceId): void\n"
          helper_signature = "    private function revokeSoftwareAuthority(PDO $pdo, int $deviceId): void\n"
          helper = "    private function revokeSoftwareAuthority(PDO $pdo, int $deviceId): void\n    {\n        $pdo->prepare(\"UPDATE homeserver_entitlement_leases SET status='revoked',revoked_at=UTC_TIMESTAMP() WHERE device_id=:device AND status='active'\")\n            ->execute(['device' => $deviceId]);\n        $pdo->prepare(\"UPDATE homeserver_installer_grants SET status='revoked',revoked_at=UTC_TIMESTAMP() WHERE device_id=:device AND status='active'\")\n            ->execute(['device' => $deviceId]);\n    }\n\n"
          if helper_signature not in text:
              if marker not in text:
                  raise SystemExit('Full device authority helper marker was not found')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
      - name: Validate repaired product tree
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/phase12_homeserver_control_plane_contract.php
      - name: Commit product repair and remove temporary workflows
        run: |
          rm -f .github/workflows/phase12-finalize.yml
          rm -f .github/workflows/phase12-authority-boundary-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/HomeServers/HomeServerControlPlaneService.php .github/workflows/phase12-finalize.yml .github/workflows/phase12-authority-boundary-repair.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize VP3 HomeServer authority boundaries"
          git push origin HEAD:feature/vp3-homeserver-control-plane-v1-20260729

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Validate PHP syntax
        run: find src public tests config workers -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run retained contracts
        run: |
          php tests/run.php
          php tests/phase3_contract.php
          php tests/phase4_contract.php
          php tests/phase5_contract.php
          php tests/phase6_contract.php
          php tests/phase7_contract.php
          php tests/phase8_contract.php
          php tests/phase9_contract.php
          php tests/phase10_contract.php
          php tests/phase11a_contract.php
          php tests/phase11b_contract.php
      - name: Run Phase 12 contract
        run: php tests/phase12_homeserver_control_plane_contract.php

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Import cumulative installer twice
        working-directory: database
        run: |
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Run retained Phase 6 and 7 database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/phase6_database_integration.php
          php tests/phase7_database_integration.php
      - name: Run Phase 12 database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: php tests/phase12_homeserver_control_plane_database_integration.php

  mariadb1011:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Import cumulative installer twice
        working-directory: database
        run: |
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Run retained Phase 6 and 7 database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/phase6_database_integration.php
          php tests/phase7_database_integration.php
      - name: Run Phase 12 database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: php tests/phase12_homeserver_control_plane_database_integration.php
