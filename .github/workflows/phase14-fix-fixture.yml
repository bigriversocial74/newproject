name: Phase 14 Fixture Repair

on:
  push:
    branches:
      - feature/vp3-phase-14-homeserver-activation-fleet-operations

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-phase-14-homeserver-activation-fleet-operations
      - name: Repair fixture-only repeated placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/phase14_homeserver_fleet_database_integration.php')
          source = path.read_text()
          old = 'PDO::ATTR_EMULATE_PREPARES => false'
          if old not in source:
              raise SystemExit('fixture PDO option not found')
          path.write_text(source.replace(old, 'PDO::ATTR_EMULATE_PREPARES => true', 1))
          PY
          php -l tests/phase14_homeserver_fleet_database_integration.php
      - name: Commit fixture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase14_homeserver_fleet_database_integration.php
          git commit -m "Repair Phase 14 database fixture bindings"
          git push origin HEAD:feature/vp3-phase-14-homeserver-activation-fleet-operations
