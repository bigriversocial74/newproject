name: Phase 14 Post-Green Repair

on:
  push:
    branches:
      - feature/vp3-phase-14-homeserver-activation-fleet-operations

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-phase-14-homeserver-activation-fleet-operations
      - name: Bind one-time bundles to issuing accounts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('public/assets/homeserver-fleet.js')
          source = client.read_text()
          source = source.replace(
              'state.oneTimeBundle = await api("/api/homeserver/v1/register.php", { license_id: licenseId, device_fingerprint: fingerprint, request_id: requestId(), idempotency_key: idempotencyKey() });',
              'state.oneTimeBundle = { ...(await api("/api/homeserver/v1/register.php", { license_id: licenseId, device_fingerprint: fingerprint, request_id: requestId(), idempotency_key: idempotencyKey() })), account_id: accountId() };',
              1,
          )
          source = source.replace(
              'state.oneTimeBundle = await api("/api/homeserver/v1/replace.php", { device_public_id: devicePublicId, replacement_fingerprint: fingerprint.trim(), request_id: requestId(), idempotency_key: idempotencyKey() });',
              'state.oneTimeBundle = { ...(await api("/api/homeserver/v1/replace.php", { device_public_id: devicePublicId, replacement_fingerprint: fingerprint.trim(), request_id: requestId(), idempotency_key: idempotencyKey() })), account_id: accountId() };',
              1,
          )
          source = source.replace('<div class="secret-row"><span>Account ID</span><code>${accountId()}</code></div>', '<div class="secret-row"><span>Account ID</span><code>${Number(bundle.account_id)}</code></div>', 1)
          source = source.replace('const text = JSON.stringify({ account_id: accountId(), device_public_id: bundle.device_public_id, credential: bundle.credential, enrollment_code: bundle.enrollment_code }, null, 2);', 'const text = JSON.stringify({ account_id: Number(bundle.account_id), device_public_id: bundle.device_public_id, credential: bundle.credential, enrollment_code: bundle.enrollment_code }, null, 2);', 1)
          source = source.replace('accountSelect?.addEventListener("change", () => load());', 'accountSelect?.addEventListener("change", () => { state.oneTimeBundle = null; state.notice = null; load(); });', 1)
          client.write_text(source)

          transfer = Path('public/assets/homeserver-transfer-accept.js')
          source = transfer.read_text()
          source = source.replace('function showBundle(bundle) {', 'function showBundle(bundle) {\n    const bundleAccountId = accountId();', 1)
          source = source.replace('<div class="secret-row"><span>Account ID</span><code>${accountId()}</code></div>', '<div class="secret-row"><span>Account ID</span><code>${bundleAccountId}</code></div>', 1)
          source = source.replace('await navigator.clipboard.writeText(JSON.stringify({ account_id: accountId(), device_public_id: bundle.device_public_id, credential: bundle.credential, enrollment_code: bundle.enrollment_code }, null, 2));', 'await navigator.clipboard.writeText(JSON.stringify({ account_id: bundleAccountId, device_public_id: bundle.device_public_id, credential: bundle.credential, enrollment_code: bundle.enrollment_code }, null, 2));', 1)
          transfer.write_text(source)

          page = Path('public/homeservers.php')
          source = page.read_text()
          header = "header('Content-Security-Policy: default-src \'self\'; script-src \'self\'; style-src \'self\'; img-src \'self\' data:; connect-src \'self\'; object-src \'none\'; base-uri \'none\'; frame-ancestors \'none\'');\n"
          marker = "header('X-Frame-Options: DENY');\n"
          if header not in source:
              source = source.replace(marker, marker + header, 1)
          page.write_text(source)

          contract = Path('tests/phase14_homeserver_fleet_contract.php')
          source = contract.read_text()
          marker = "$assert(str_contains($options, \"hs.status<>'revoked'\"), 'Eligible-license query does not exclude occupied licenses.');\n"
          addition = marker + "$assert(str_contains($options, 'hs.id IS NULL'), 'Eligible-license query does not require an unoccupied license.');\n"
          if "'hs.id IS NULL'" not in source:
              source = source.replace(marker, addition, 1)
          source = source.replace("$assert(str_contains($page, \"header('Cache-Control: no-store')\"), 'Fleet page does not disable response caching.');", "$assert(str_contains($page, \"header('Cache-Control: no-store')\"), 'Fleet page does not disable response caching.');\n$assert(str_contains($page, 'Content-Security-Policy'), 'Fleet page does not enforce a restrictive content security policy.');")
          source += "\n"
          contract.write_text(source)
          PY
          php -l public/homeservers.php
          php -l tests/phase14_homeserver_fleet_contract.php
          node --check public/assets/homeserver-fleet.js
          node --check public/assets/homeserver-transfer-accept.js
          php tests/phase14_homeserver_fleet_contract.php
      - name: Commit post-green repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/homeservers.php public/assets/homeserver-fleet.js public/assets/homeserver-transfer-accept.js tests/phase14_homeserver_fleet_contract.php
          git commit -m "Bind Phase 14 activation bundles to issuing accounts"
          git push origin HEAD:feature/vp3-phase-14-homeserver-activation-fleet-operations
