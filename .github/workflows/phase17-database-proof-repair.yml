name: Phase 17 Database Proof Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/vp3-phase-17-account-team-security-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-phase-17-account-team-security-control
          fetch-depth: 0
      - name: Repair exact-head database proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/phase17_account_team_security_database_integration.php')
          text = path.read_text()

          old = 'PDO::ATTR_EMULATE_PREPARES => true'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one PDO mode anchor, found {text.count(old)}')
          text = text.replace(old, 'PDO::ATTR_EMULATE_PREPARES => false', 1)

          old = """    $challenge = $mfa->createChallenge($owner['id'], '198.51.100.17', 'Phase17-MFA-Agent');
              $expectAuthCode(
                  static fn () => $mfa->completeChallenge($challenge['challenge_token'], $recoveryCode, '198.51.100.18', 'Phase17-MFA-Agent', 'REQ-P17-MFA-BIND-' . $upper),
                  'mfa_challenge_invalid',
                  'MFA challenge accepted a different IP binding.'
              );
              $completedUser = $mfa->completeChallenge($challenge['challenge_token'], $recoveryCode, '198.51.100.17', 'Phase17-MFA-Agent', 'REQ-P17-MFA-RECOVERY-' . $upper);
          """
          new = """    $bindingChallenge = $mfa->createChallenge($owner['id'], '198.51.100.17', 'Phase17-MFA-Agent');
              $expectAuthCode(
                  static fn () => $mfa->completeChallenge($bindingChallenge['challenge_token'], $recoveryCode, '198.51.100.18', 'Phase17-MFA-Agent', 'REQ-P17-MFA-BIND-' . $upper),
                  'mfa_challenge_invalid',
                  'MFA challenge accepted a different IP binding.'
              );
              $bindingState = $pdo->prepare('SELECT consumed_at FROM auth_mfa_challenges WHERE token_hash=:hash');
              $bindingState->execute(['hash' => hash('sha256', $bindingChallenge['challenge_token'])]);
              $assert($bindingState->fetchColumn() !== null, 'A binding-mismatched MFA challenge remained reusable.');
              $challenge = $mfa->createChallenge($owner['id'], '198.51.100.17', 'Phase17-MFA-Agent');
              $completedUser = $mfa->completeChallenge($challenge['challenge_token'], $recoveryCode, '198.51.100.17', 'Phase17-MFA-Agent', 'REQ-P17-MFA-RECOVERY-' . $upper);
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one challenge-binding anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    $mfaDenied->execute(['user' => $owner['id'], 'request' => $reuseRequest]);
              $assert((int) $mfaDenied->fetchColumn() === 1, 'Denied recovery-code replay evidence did not persist.');
          """
          new = """    $challengeDenied = $pdo->prepare(\"SELECT COUNT(*) FROM account_security_receipts WHERE actor_user_id=:user AND action='mfa.challenge_completed' AND request_id=:request AND result='denied'\");
              $challengeDenied->execute(['user' => $owner['id'], 'request' => $reuseRequest]);
              $assert((int) $challengeDenied->fetchColumn() === 1, 'Denied recovery-code replay evidence did not persist.');
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one recovery receipt anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    $lockChallenge = $mfa->createChallenge($owner['id'], '203.0.113.17', 'Phase17-Lock-Agent');
              $claim = $pdo->prepare('UPDATE auth_mfa_challenges SET attempt_count=attempt_count+1 WHERE token_hash=:hash AND consumed_at IS NULL AND expires_at>UTC_TIMESTAMP() AND attempt_count<max_attempts');
              for ($attempt = 1; $attempt <= 6; $attempt++) {
                  $claim->execute(['hash' => hash('sha256', $lockChallenge['challenge_token'])]);
                  $assert($claim->rowCount() === 1, 'MFA attempt claim failed before the configured limit.');
              }
              $claim->execute(['hash' => hash('sha256', $lockChallenge['challenge_token'])]);
              $assert($claim->rowCount() === 0, 'MFA challenge accepted an attempt beyond max_attempts.');
          """
          new = """    $lockChallenge = $mfa->createChallenge($owner['id'], '203.0.113.17', 'Phase17-Lock-Agent');
              for ($attempt = 1; $attempt <= 5; $attempt++) {
                  $expectAuthCode(
                      static fn () => $mfa->completeChallenge($lockChallenge['challenge_token'], $invalidCode, '203.0.113.17', 'Phase17-Lock-Agent', 'REQ-P17-MFA-LOCK-' . $attempt . '-' . $upper),
                      'mfa_code_invalid',
                      'MFA challenge locked before the configured attempt limit.'
                  );
              }
              $expectAuthCode(
                  static fn () => $mfa->completeChallenge($lockChallenge['challenge_token'], $invalidCode, '203.0.113.17', 'Phase17-Lock-Agent', 'REQ-P17-MFA-LOCK-6-' . $upper),
                  'mfa_challenge_locked',
                  'MFA challenge did not lock on the sixth invalid code.'
              );
              $lockedState = $pdo->prepare('SELECT attempt_count,max_attempts,consumed_at FROM auth_mfa_challenges WHERE token_hash=:hash');
              $lockedState->execute(['hash' => hash('sha256', $lockChallenge['challenge_token'])]);
              $lockedRow = $lockedState->fetch(PDO::FETCH_ASSOC);
              $assert(is_array($lockedRow) && (int) $lockedRow['attempt_count'] === (int) $lockedRow['max_attempts'] && $lockedRow['consumed_at'] !== null, 'MFA lock state was not persisted atomically.');
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one attempt-lock anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          php -l tests/phase17_account_team_security_database_integration.php
          rm -f .github/workflows/phase17-database-proof-repair.yml
          git config user.name "VP3 Phase 17 Database Proof"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen Phase 17 database security proofs"
          git push origin HEAD:feature/vp3-phase-17-account-team-security-control
