name: Apply Phase 4 Source

on:
  pull_request:
    branches:
      - main
    paths:
      - '.phase4-payload/**'
      - '.github/workflows/apply-phase4-source.yml'
  push:
    branches:
      - feature/vp3-phase-4-stripe-billing-20260729
    paths:
      - '.phase4-payload/**'
      - '.github/workflows/apply-phase4-source.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-4-stripe-billing-20260729
          fetch-depth: 0
      - name: Validate and unpack Phase 4 payload
        run: |
          set -euo pipefail
          cat .phase4-payload/part* | base64 --decode > /tmp/phase4-source.tgz
          test "$(wc -c < /tmp/phase4-source.tgz)" -eq 20732
          echo '5e539d72ffab4a0febe1b50f1acf256ed7c624fff2f0a269d1edde74d620087b  /tmp/phase4-source.tgz' | sha256sum --check
          tar -tzf /tmp/phase4-source.tgz
          tar -xzf /tmp/phase4-source.tgz -C .
      - name: Commit Phase 4 Stripe billing implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bootstrap.php \
            config/config-example.php \
            database/migrations/20260729_phase4_stripe_billing.sql \
            database/vp3-single-install.sql \
            public/webhooks/stripe.php \
            src/Billing/BillingGraceService.php \
            src/Billing/StripeApiClient.php \
            src/Billing/StripeCatalogService.php \
            src/Billing/StripeCheckoutService.php \
            src/Billing/StripeGateway.php \
            src/Billing/StripeSignatureVerifier.php \
            src/Billing/StripeWebhookService.php \
            tests/phase4_contract.php \
            tests/phase4_database_integration.php
          if git diff --cached --quiet; then
            echo 'Phase 4 source files already match the payload.'
            exit 0
          fi
          git commit -m 'Build Phase 4 Stripe billing lifecycle'
          git push origin HEAD:feature/vp3-phase-4-stripe-billing-20260729
