name: Phase 11C Production Adapters

on:
  push:
    branches:
      - feature/vp3-phase-11c-production-adapters
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: phase11c-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, mbstring, openssl, sodium, zip
          coverage: none
      - id: platform
        name: Validate Composer and runtime platform
        continue-on-error: true
        run: |
          composer validate --strict --no-check-publish
          php -r '$required = ["pdo", "pdo_mysql", "json", "mbstring", "openssl", "sodium", "zip"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'
      - id: syntax
        name: Validate PHP syntax
        continue-on-error: true
        run: find src public tests config workers -name '*.php' -print0 | xargs -0 -n1 php -l
      - id: retained
        name: Run retained static and runtime certification
        continue-on-error: true
        run: |
          php tests/run.php
          php tests/phase3_contract.php
          php tests/phase4_contract.php
          php tests/phase5_contract.php
          php tests/phase6_contract.php
          php tests/phase7_contract.php
          php tests/phase8_contract.php
          php tests/phase9_contract.php
          php tests/phase10_contract.php
          php tests/phase11a_contract.php
          php tests/phase11a_runtime.php
          php tests/phase11b_contract.php
          php tests/phase11b_runtime.php
      - id: phase11c
        name: Run Phase 11C static and runtime certification
        continue-on-error: true
        run: |
          php tests/phase11c_contract.php
          php tests/phase11c_runtime.php
          php tests/phase11c_extended_contract.php
          php tests/phase11c_notifications_runtime.php
          php tests/phase11c_update_contract.php
      - name: Publish PHP stage statuses
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.php }}
          PLATFORM: ${{ steps.platform.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          PHASE11C: ${{ steps.phase11c.outcome }}
        run: |
          bash .github/scripts/publish-commit-status.sh "phase11c/php-${VERSION}/platform" "$PLATFORM" "Phase 11C PHP ${VERSION} platform"
          bash .github/scripts/publish-commit-status.sh "phase11c/php-${VERSION}/syntax" "$SYNTAX" "Phase 11C PHP ${VERSION} syntax"
          bash .github/scripts/publish-commit-status.sh "phase11c/php-${VERSION}/retained" "$RETAINED" "Phase 11C PHP ${VERSION} retained"
          bash .github/scripts/publish-commit-status.sh "phase11c/php-${VERSION}/phase11c" "$PHASE11C" "Phase 11C PHP ${VERSION} adapter tests"
          aggregate=success
          if [[ "$PLATFORM" != success || "$SYNTAX" != success || "$RETAINED" != success || "$PHASE11C" != success ]]; then aggregate=failure; fi
          bash .github/scripts/publish-commit-status.sh "phase11c/php-${VERSION}" "$aggregate" "Phase 11C PHP ${VERSION}"
      - name: Enforce PHP certification
        if: always()
        env:
          PLATFORM: ${{ steps.platform.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          PHASE11C: ${{ steps.phase11c.outcome }}
        run: |
          [[ "$PLATFORM" == success ]]
          [[ "$SYNTAX" == success ]]
          [[ "$RETAINED" == success ]]
          [[ "$PHASE11C" == success ]]

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, openssl, sodium, zip
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - id: schema
        name: Import cumulative schema twice
        continue-on-error: true
        working-directory: database
        run: |
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
      - id: retained
        name: Run retained database certification
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/database-integration.php
          php tests/phase3_database_integration.php
          php tests/phase4_database_integration.php
          php tests/phase5_database_integration.php
          php tests/phase6_database_integration.php
          php tests/phase7_database_integration.php
          php tests/phase8_database_integration.php
          php tests/phase9_database_integration.php
          php tests/phase10_database_integration.php
          php tests/phase11a_database_integration.php
          php tests/phase11b_database_integration.php
          php tests/phase11b_post_audit_database_integration.php
      - id: provisioning
        name: Run MySQL 8 Phase 11C provisioning lifecycle certification
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_DB_HOST: 127.0.0.1
          VP3_TEST_DB_PORT: 3306
        run: php tests/phase11c_database_integration.php
      - id: backup
        name: Run MySQL 8 Phase 11C encrypted backup drill
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_DB_HOST: 127.0.0.1
          VP3_TEST_DB_PORT: 3306
          VP3_TEST_DUMP_BINARY: /usr/bin/mysqldump
          VP3_TEST_MYSQL_BINARY: /usr/bin/mysql
        run: php tests/phase11c_backup_database_integration.php
      - id: update
        name: Run MySQL 8 Phase 11C update and rollback drill
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_DB_HOST: 127.0.0.1
          VP3_TEST_DB_PORT: 3306
          VP3_TEST_DUMP_BINARY: /usr/bin/mysqldump
          VP3_TEST_MYSQL_BINARY: /usr/bin/mysql
        run: php tests/phase11c_update_database_integration.php
      - name: Publish MySQL stage statuses
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA: ${{ steps.schema.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          PROVISIONING: ${{ steps.provisioning.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          UPDATE: ${{ steps.update.outcome }}
        run: |
          bash .github/scripts/publish-commit-status.sh "phase11c/mysql8/schema" "$SCHEMA" "Phase 11C MySQL 8 schema"
          bash .github/scripts/publish-commit-status.sh "phase11c/mysql8/retained" "$RETAINED" "Phase 11C MySQL 8 retained"
          bash .github/scripts/publish-commit-status.sh "phase11c/mysql8/provisioning" "$PROVISIONING" "Phase 11C MySQL 8 provisioning"
          bash .github/scripts/publish-commit-status.sh "phase11c/mysql8/backup" "$BACKUP" "Phase 11C MySQL 8 backup"
          bash .github/scripts/publish-commit-status.sh "phase11c/mysql8/update" "$UPDATE" "Phase 11C MySQL 8 update"
          aggregate=success
          if [[ "$SCHEMA" != success || "$RETAINED" != success || "$PROVISIONING" != success || "$BACKUP" != success || "$UPDATE" != success ]]; then aggregate=failure; fi
          bash .github/scripts/publish-commit-status.sh "phase11c/mysql8" "$aggregate" "Phase 11C MySQL 8"
      - name: Enforce MySQL certification
        if: always()
        env:
          SCHEMA: ${{ steps.schema.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          PROVISIONING: ${{ steps.provisioning.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          UPDATE: ${{ steps.update.outcome }}
        run: |
          [[ "$SCHEMA" == success ]]
          [[ "$RETAINED" == success ]]
          [[ "$PROVISIONING" == success ]]
          [[ "$BACKUP" == success ]]
          [[ "$UPDATE" == success ]]

  mariadb1011:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, openssl, sodium, zip
          coverage: none
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - id: schema
        name: Import cumulative schema twice
        continue-on-error: true
        working-directory: database
        run: |
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
      - id: retained
        name: Run retained database certification
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/database-integration.php
          php tests/phase3_database_integration.php
          php tests/phase4_database_integration.php
          php tests/phase5_database_integration.php
          php tests/phase6_database_integration.php
          php tests/phase7_database_integration.php
          php tests/phase8_database_integration.php
          php tests/phase9_database_integration.php
          php tests/phase10_database_integration.php
          php tests/phase11a_database_integration.php
          php tests/phase11b_database_integration.php
          php tests/phase11b_post_audit_database_integration.php
      - id: provisioning
        name: Run MariaDB 10.11 Phase 11C provisioning lifecycle certification
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_DB_HOST: 127.0.0.1
          VP3_TEST_DB_PORT: 3307
        run: php tests/phase11c_database_integration.php
      - id: backup
        name: Run MariaDB 10.11 Phase 11C encrypted backup drill
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_DB_HOST: 127.0.0.1
          VP3_TEST_DB_PORT: 3307
          VP3_TEST_DUMP_BINARY: /usr/bin/mariadb-dump
          VP3_TEST_MYSQL_BINARY: /usr/bin/mariadb
        run: php tests/phase11c_backup_database_integration.php
      - id: update
        name: Run MariaDB 10.11 Phase 11C update and rollback drill
        continue-on-error: true
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_DB_HOST: 127.0.0.1
          VP3_TEST_DB_PORT: 3307
          VP3_TEST_DUMP_BINARY: /usr/bin/mariadb-dump
          VP3_TEST_MYSQL_BINARY: /usr/bin/mariadb
        run: php tests/phase11c_update_database_integration.php
      - name: Publish MariaDB stage statuses
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA: ${{ steps.schema.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          PROVISIONING: ${{ steps.provisioning.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          UPDATE: ${{ steps.update.outcome }}
        run: |
          bash .github/scripts/publish-commit-status.sh "phase11c/mariadb1011/schema" "$SCHEMA" "Phase 11C MariaDB schema"
          bash .github/scripts/publish-commit-status.sh "phase11c/mariadb1011/retained" "$RETAINED" "Phase 11C MariaDB retained"
          bash .github/scripts/publish-commit-status.sh "phase11c/mariadb1011/provisioning" "$PROVISIONING" "Phase 11C MariaDB provisioning"
          bash .github/scripts/publish-commit-status.sh "phase11c/mariadb1011/backup" "$BACKUP" "Phase 11C MariaDB backup"
          bash .github/scripts/publish-commit-status.sh "phase11c/mariadb1011/update" "$UPDATE" "Phase 11C MariaDB update"
          aggregate=success
          if [[ "$SCHEMA" != success || "$RETAINED" != success || "$PROVISIONING" != success || "$BACKUP" != success || "$UPDATE" != success ]]; then aggregate=failure; fi
          bash .github/scripts/publish-commit-status.sh "phase11c/mariadb1011" "$aggregate" "Phase 11C MariaDB 10.11"
      - name: Enforce MariaDB certification
        if: always()
        env:
          SCHEMA: ${{ steps.schema.outcome }}
          RETAINED: ${{ steps.retained.outcome }}
          PROVISIONING: ${{ steps.provisioning.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          UPDATE: ${{ steps.update.outcome }}
        run: |
          [[ "$SCHEMA" == success ]]
          [[ "$RETAINED" == success ]]
          [[ "$PROVISIONING" == success ]]
          [[ "$BACKUP" == success ]]
          [[ "$UPDATE" == success ]]
