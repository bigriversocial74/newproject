name: Phase 35 First Pass Repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase35-first-pass-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair retained identity, scrub assertion and latency guard
        run: |
          python3 <<'PY'
          from pathlib import Path

          worker = Path('src/Reliability/ReliabilityWorkerService.php')
          text = worker.read_text()
          old = "$latencyBreach = $latencyTarget > 0 && $latencyMs !== null && $latencyMs > $latencyTarget;"
          new = "$latencyBreach = $observationStatus === 'success'\n            && $latencyTarget > 0\n            && $latencyMs !== null\n            && $latencyMs > $latencyTarget;"
          if old in text:
              text = text.replace(old, new, 1)
          elif "$latencyBreach = $observationStatus === 'success'" not in text:
              raise SystemExit('Phase 35 latency guard anchor not found')
          worker.write_text(text)

          contract = Path('tests/phase34_release_deployment_control_center_contract.php')
          text = contract.read_text()
          old = '''$entries = array_values(array_filter(array_map('trim', explode("\\n", $manifest)), static fn (string $line): bool => $line !== '' && !str_starts_with($line, '#')));
          $assert(end($entries) === 'migrations/20260731_phase34_release_deployment_control_center.sql', 'Phase 34 is not the current installer tail.');
          foreach (["'format' => 'vp3-platform-release-v2'", "'version' => '34.0.0'", "'schema_level' => 34", "'migration_tail' => 'migrations/20260731_phase34_release_deployment_control_center.sql'"] as $identity) {
              $assert(str_contains($release, $identity), 'Phase 34 release identity is missing ' . $identity . '.');
          }'''
          new = '''$entries = array_values(array_filter(array_map('trim', explode("\\n", $manifest)), static fn (string $line): bool => $line !== '' && !str_starts_with($line, '#')));
          $phase34Migration = 'migrations/20260731_phase34_release_deployment_control_center.sql';
          $assert(in_array($phase34Migration, $entries, true), 'Phase 34 migration is missing from the ordered installer manifest.');
          $releaseConfig = require $root . '/config/release.php';
          $assert(($releaseConfig['format'] ?? null) === 'vp3-platform-release-v2', 'The platform release format no longer retains the Phase 34 signed-manifest contract.');
          $assert(version_compare((string) ($releaseConfig['version'] ?? '0.0.0'), '34.0.0', '>='), 'The current release identity predates Phase 34.');
          $assert((int) ($releaseConfig['schema_level'] ?? 0) >= 34, 'The current schema level predates Phase 34.');
          $assert(($releaseConfig['migration_tail'] ?? null) === end($entries), 'The current release migration tail does not match the ordered installer manifest.');'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "$phase34Migration = 'migrations/20260731_phase34_release_deployment_control_center.sql';" not in text:
              raise SystemExit('Phase 34 future-safe identity anchor not found')
          contract.write_text(text)

          phase35 = Path('tests/phase35_platform_reliability_slo_status_center_contract.php')
          text = phase35.read_text()
          old = '''$assert(str_contains($action, "unset(\\$row['account_scope']") && str_contains($action, "unset(\\$row['target_value']"), 'Reliability browser responses are not explicitly scrubbed.');'''
          new = '''$assert(str_contains($action, "unset(\\$row['account_scope']")
              && str_contains($action, "\\$row['target_value']")
              && str_contains($action, "\\$row['target_hash']"), 'Reliability browser responses are not explicitly scrubbed.');'''
          if old in text:
              text = text.replace(old, new, 1)
          elif "str_contains($action, \"\\$row['target_hash']\")" not in text:
              raise SystemExit('Phase 35 scrub assertion anchor not found')
          phase35.write_text(text)
          PY
          php -l src/Reliability/ReliabilityWorkerService.php
          php -l tests/phase34_release_deployment_control_center_contract.php
          php -l tests/phase35_platform_reliability_slo_status_center_contract.php
          php tests/phase34_release_deployment_control_center_contract.php
          php tests/phase35_platform_reliability_slo_status_center_contract.php
          git diff --check
          if git diff --quiet -- src/Reliability/ReliabilityWorkerService.php tests/phase34_release_deployment_control_center_contract.php tests/phase35_platform_reliability_slo_status_center_contract.php; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "vp3-certification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Reliability/ReliabilityWorkerService.php tests/phase34_release_deployment_control_center_contract.php tests/phase35_platform_reliability_slo_status_center_contract.php
          git commit -m "Repair Phase 35 latency threshold and retained contracts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
