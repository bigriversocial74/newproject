name: Phase 20 Infrastructure Serialization

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase20-serialization-vp3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@0c0c27b4cb4cc611a83d6f7372e7f7f945ceb49a
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, openssl
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Import cumulative installer twice
        working-directory: database
        run: |
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Build Phase 20 fixture and prove serialization
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/phase20_infrastructure_control_center_database_integration.php
          php tests/phase20_infrastructure_operation_serialization_database_integration.php

  mariadb1011:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@0c0c27b4cb4cc611a83d6f7372e7f7f945ceb49a
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, openssl
          coverage: none
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Import cumulative installer twice
        working-directory: database
        run: |
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Build Phase 20 fixture and prove serialization
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/phase20_infrastructure_control_center_database_integration.php
          php tests/phase20_infrastructure_operation_serialization_database_integration.php
