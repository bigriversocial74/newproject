name: Phase 35 Binding Map Repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase35-binding-map-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair component and status binding maps
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Reliability/ReliabilityControlCenterActionService.php')
          text = path.read_text()

          component_pattern = re.compile(
              r"('display_order'\s*=>\s*\$displayOrder,\s*)"
              r"'created_by_user_id'\s*=>\s*\$actorId,\s*"
              r"'updated_by_user_id'\s*=>\s*\$actorId,\s*"
              r"('created'\s*=>\s*\$now,)",
              re.MULTILINE,
          )
          if component_pattern.search(text):
              text = component_pattern.sub(r"\1'actor_id' => $actorId,\n                    \2", text, count=1)
          elif not re.search(r"'display_order'\s*=>\s*\$displayOrder,\s*'actor_id'\s*=>\s*\$actorId", text):
              raise SystemExit('Component binding anchor not found')

          status_pattern = re.compile(
              r"('history'\s*=>\s*\$showHistory\s*\?\s*1\s*:\s*0,\s*)"
              r"'actor_id'\s*=>\s*\$actorId,\s*"
              r"('created'\s*=>\s*\$now,)",
              re.MULTILINE,
          )
          if status_pattern.search(text):
              text = status_pattern.sub(
                  r"\1'created_by_user_id' => $actorId,\n                    'updated_by_user_id' => $actorId,\n                    \2",
                  text,
                  count=1,
              )
          elif not re.search(r"'history'\s*=>\s*\$showHistory\s*\?\s*1\s*:\s*0,\s*'created_by_user_id'\s*=>\s*\$actorId", text):
              raise SystemExit('Status settings binding anchor not found')

          path.write_text(text)
          PY
          php -l src/Reliability/ReliabilityControlCenterActionService.php
          git diff --check
          if git diff --quiet -- src/Reliability/ReliabilityControlCenterActionService.php; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "vp3-certification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Reliability/ReliabilityControlCenterActionService.php
          git commit -m "Repair Phase 35 native PDO binding maps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
