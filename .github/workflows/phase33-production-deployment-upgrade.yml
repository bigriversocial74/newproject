name: Phase 33 Production Deployment and Upgrade

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase33-vp3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VP3_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate PHP ${{ matrix.php }} and Phase 33 contracts
        run: |
          docker run --rm \
            -e VP3_RELEASE_COMMIT="$VP3_RELEASE_COMMIT" \
            -v "$PWD:/app" -w /app php:${{ matrix.php }}-cli-bookworm sh -lc '
              find src public tests config workers tools -name "*.php" -print0 | xargs -0 -n1 php -l &&
              php tools/build-single-install.php &&
              ! grep -Eq "^[[:space:]]*SOURCE[[:space:]]" database/vp3-single-install.sql &&
              php tests/phase30_security_audit_hardening_contract.php &&
              php tests/phase31_security_center_contract.php &&
              php tests/phase32_security_incident_automation_contract.php &&
              php tests/phase33_production_deployment_contract.php &&
              php tests/phase33_operator_controls_contract.php
            '
          git diff --exit-code -- database/vp3-single-install.sql
      - name: Upload certified standalone installer
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vp3-phase33-single-install
          path: database/vp3-single-install.sql
          if-no-files-found: error
          retention-days: 7

  mysql8:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PHP and MySQL deployment clients
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring php-zip mysql-client
          php -r '$required=["pdo","pdo_mysql","json","mbstring","openssl","sodium","zip"]; foreach($required as $extension){if(!extension_loaded($extension)){fwrite(STDERR,"Missing {$extension}\n");exit(1);}}'
      - name: Verify and import committed standalone installer twice
        run: |
          php tools/build-single-install.php
          git diff --exit-code -- database/vp3-single-install.sql
          ! grep -Eq "^[[:space:]]*SOURCE[[:space:]]" database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
      - name: Run Phase 33 MySQL deployment certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_MYSQL_BINARY: /usr/bin/mysql
          VP3_TEST_MYSQLDUMP_BINARY: /usr/bin/mysqldump
        run: |
          php tests/phase30_security_audit_hardening_database_integration.php
          php tests/phase32_security_incident_automation_database_integration.php
          php tests/phase32_security_operations_database_integration.php
          php tests/phase32_assignment_replay_database_integration.php
          php tests/phase33_production_deployment_database_integration.php
          php tests/phase33_operator_controls_database_integration.php

  mariadb1011:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PHP and MariaDB deployment clients
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring php-zip mariadb-client
          php -r '$required=["pdo","pdo_mysql","json","mbstring","openssl","sodium","zip"]; foreach($required as $extension){if(!extension_loaded($extension)){fwrite(STDERR,"Missing {$extension}\n");exit(1);}}'
      - name: Verify and import committed standalone installer twice
        run: |
          php tools/build-single-install.php
          git diff --exit-code -- database/vp3-single-install.sql
          ! grep -Eq "^[[:space:]]*SOURCE[[:space:]]" database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
      - name: Run Phase 33 MariaDB deployment certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_MYSQL_BINARY: /usr/bin/mariadb
          VP3_TEST_MYSQLDUMP_BINARY: /usr/bin/mariadb-dump
        run: |
          php tests/phase30_security_audit_hardening_database_integration.php
          php tests/phase32_security_incident_automation_database_integration.php
          php tests/phase32_security_operations_database_integration.php
          php tests/phase32_assignment_replay_database_integration.php
          php tests/phase33_production_deployment_database_integration.php
          php tests/phase33_operator_controls_database_integration.php

  repair-upgrade-service:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Harden install preflight and future migration baselining
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Deployment/PlatformUpgradeService.php')
          text = path.read_text()
          install_old = """        return $this->withLock(function (PDO $pdo) use ($requestId): array {
            if (!$this->databaseIsEmpty($pdo)) {"""
          install_new = """        return $this->withLock(function (PDO $pdo) use ($requestId): array {
            $report = $this->preflight->inspect($pdo);
            if (($report['ok'] ?? false) !== true) {
                throw new RuntimeException('platform_install_preflight_failed:' . implode(',', (array) ($report['failures'] ?? [])));
            }
            if (!$this->databaseIsEmpty($pdo)) {"""
          if install_old in text:
              text = text.replace(install_old, install_new, 1)
          baseline_old = """        foreach ($this->releases->migrationPaths() as $path) {
            $mode = $path === 'migrations/20260731_phase33_production_deployment_upgrade.sql'
                ? ($phase33Bootstrapped ? 'upgrade' : 'baseline')
                : 'baseline';
            $pdo->prepare(
                'INSERT INTO platform_schema_migrations
                 (migration_path,migration_sha256,applied_release_version,application_mode,applied_at)
                 VALUES (:path,:sha,:release,:mode,:applied_at)'
            )->execute([
                'path' => $path,
                'sha' => $this->releases->migrationSha256($path),
                'release' => $releaseVersion,
                'mode' => $mode,
                'applied_at' => $this->now(),
            ]);
        }"""
          baseline_new = """        $phase33Path = 'migrations/20260731_phase33_production_deployment_upgrade.sql';
        foreach ($this->releases->migrationPaths() as $path) {
            if ($path === $phase33Path && !$phase33Bootstrapped) {
                break;
            }
            $mode = $path === $phase33Path ? 'upgrade' : 'baseline';
            $pdo->prepare(
                'INSERT INTO platform_schema_migrations
                 (migration_path,migration_sha256,applied_release_version,application_mode,applied_at)
                 VALUES (:path,:sha,:release,:mode,:applied_at)'
            )->execute([
                'path' => $path,
                'sha' => $this->releases->migrationSha256($path),
                'release' => $releaseVersion,
                'mode' => $mode,
                'applied_at' => $this->now(),
            ]);
            if ($path === $phase33Path) {
                break;
            }
        }"""
          if baseline_old in text:
              text = text.replace(baseline_old, baseline_new, 1)
          path.write_text(text)
          PY
          if git diff --quiet -- src/Deployment/PlatformUpgradeService.php; then
            echo "Upgrade service is already hardened."
            exit 0
          fi
          git config user.name "vp3-certification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Deployment/PlatformUpgradeService.php
          git commit -m "Harden Phase 33 install and future migration baselining"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
