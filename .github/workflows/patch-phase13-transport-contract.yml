name: Patch Phase 13 Signed Transport Contract

on:
  push:
    branches:
      - feature/vp3-phase-13-homeserver-cutover-contract
    paths:
      - .github/workflows/patch-phase13-transport-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-13-homeserver-cutover-contract
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Add signed transport evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('src/Releases/ReleaseCatalogService.php')
          text = catalog.read_text()
          marker = "            'release_notes_hash' => $release['release_notes_hash'],\n"
          addition = (
              marker
              + "            'published_at_utc' => gmdate('Y-m-d\\TH:i:s\\Z'),\n"
              + "            'installer_download_path' => '/api/homeserver/v1/installer-download.php',\n"
          )
          if marker not in text:
              raise SystemExit('Signed release manifest insertion point was not found')
          text = text.replace(marker, addition, 1)
          catalog.write_text(text)

          download = Path('public/api/homeserver/v1/installer-download.php')
          text = download.read_text()
          marker = "    $grant = (string) ($_GET['grant'] ?? '');\n"
          replacement = (
              "    $grant = trim((string) ($_GET['grant'] ?? ''));\n"
              "    if ($grant === '') {\n"
              "        $grant = HomeServerEndpoint::bearerCredential();\n"
              "    }\n"
          )
          if marker not in text:
              raise SystemExit('Installer grant extraction point was not found')
          download.write_text(text.replace(marker, replacement, 1))

          contract = Path('tests/phase13_homeserver_cutover_contract.php')
          text = contract.read_text()
          marker = "$assert(str_contains($catalog, 'authenticode_thumbprint,size_bytes FROM release_artifacts'), 'Authenticode thumbprint is not included in the signed manifest.');\n"
          addition = (
              marker
              + "$download = $read('public/api/homeserver/v1/installer-download.php');\n"
              + "$assert(str_contains($catalog, \"'published_at_utc'\"), 'Signed HomeServer release publication time is missing.');\n"
              + "$assert(str_contains($catalog, \"'installer_download_path'\"), 'Signed stable HomeServer installer path is missing.');\n"
              + "$assert(str_contains($download, 'HomeServerEndpoint::bearerCredential()'), 'Installer grants cannot be supplied as bearer credentials.');\n"
          )
          if marker not in text:
              raise SystemExit('Phase 13 transport assertion point was not found')
          contract.write_text(text.replace(marker, addition, 1))
          PY
      - name: Validate signed transport contract
        run: |
          php -l src/Releases/ReleaseCatalogService.php
          php -l public/api/homeserver/v1/installer-download.php
          php -l tests/phase13_homeserver_cutover_contract.php
          php tests/phase12_homeserver_control_plane_contract.php
          php tests/phase13_homeserver_cutover_contract.php
      - name: Commit validated transport contract
        run: |
          rm .github/workflows/patch-phase13-transport-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Sign VP3 HomeServer installer transport contract"
          git push origin HEAD:feature/vp3-phase-13-homeserver-cutover-contract
