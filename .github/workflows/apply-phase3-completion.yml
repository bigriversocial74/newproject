name: Apply Phase 3 Completion

on:
  pull_request:
    branches:
      - main
    paths:
      - '.phase3-payload/**'
      - '.github/workflows/apply-phase3-completion.yml'
  push:
    branches:
      - feature/vp3-phase-3-domain-plans-licenses-20260729
    paths:
      - '.phase3-payload/**'
      - '.github/workflows/apply-phase3-completion.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-3-domain-plans-licenses-20260729
          fetch-depth: 0
      - name: Validate and unpack completion payload
        run: |
          set -euo pipefail
          cat .phase3-payload/part* | base64 --decode > /tmp/phase3-completion.tgz
          test "$(wc -c < /tmp/phase3-completion.tgz)" -eq 20613
          echo '70494eeba295c0611b9e81bcb2b6b39dc59a24b3b4aa43b710227bfc8256332f  /tmp/phase3-completion.tgz' | sha256sum --check
          tar -tzf /tmp/phase3-completion.tgz
          tar -xzf /tmp/phase3-completion.tgz -C .
      - name: Commit completed Phase 3 implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/phase3-domain-plans-licenses.yml \
            bootstrap.php \
            database/migrations/20260729_phase3_domain_plans_licenses.sql \
            database/vp3-single-install.sql \
            src/Billing/SubscriptionLifecycleService.php \
            src/Catalog/PlanCatalogService.php \
            src/DomainCodes/DomainRegistryService.php \
            src/Licensing/DomainLicenseBundleService.php \
            src/Licensing/LicenseLifecycleService.php \
            tests/phase3_contract.php \
            tests/phase3_database_integration.php
          if git diff --cached --quiet; then
            echo 'Phase 3 completion files already match the payload.'
            exit 0
          fi
          git commit -m 'Complete Phase 3 domain lifecycle and paired licensing'
          git push origin HEAD:feature/vp3-phase-3-domain-plans-licenses-20260729
