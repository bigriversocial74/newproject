name: Legacy VP3 Phase Workflow (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vp3-legacy-manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired workflow notice
        run: echo "This historical workflow is manual-only. Use VP3 Retained Certification for current final regression testing."
