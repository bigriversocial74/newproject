name: Phase 35 Status Settings Repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase35-status-settings-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair native PDO status settings insert
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/Reliability/ReliabilityControlCenterActionService.php')
          text = path.read_text()
          old_sql = 'VALUES (:account_id,:slug,:title,:description,:enabled,:history,:actor_id,:actor_id,:created,:updated)'
          new_sql = 'VALUES (:account_id,:slug,:title,:description,:enabled,:history,:created_by_user_id,:updated_by_user_id,:created,:updated)'
          if old_sql in text:
              text = text.replace(old_sql, new_sql, 1)
          elif ':created_by_user_id,:updated_by_user_id' not in text:
              raise SystemExit('Status settings SQL anchor not found')
          old_param = "                    'actor_id' => $actorId,\n                    'created' => $now,"
          new_param = "                    'created_by_user_id' => $actorId,\n                    'updated_by_user_id' => $actorId,\n                    'created' => $now,"
          if old_param in text:
              text = text.replace(old_param, new_param, 1)
          elif "'updated_by_user_id' => $actorId" not in text:
              raise SystemExit('Status settings parameter anchor not found')
          path.write_text(text)
          PY
          php -l src/Reliability/ReliabilityControlCenterActionService.php
          git diff --check
          if git diff --quiet -- src/Reliability/ReliabilityControlCenterActionService.php; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "vp3-certification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Reliability/ReliabilityControlCenterActionService.php
          git commit -m "Repair native PDO status settings persistence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
