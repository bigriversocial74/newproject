name: Apply Phase 11A Update Ownership Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/vp3-phase-11a-runtime-queue-hardening-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-11a-runtime-queue-hardening-20260729
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply and validate update ownership repair
        run: |
          python3 .phase11a-update-ownership/apply.py
          rm -rf .phase11a-update-ownership
          php -l src/Updates/SoftwareUpdateService.php
          php tests/phase11a_contract.php
          php tests/phase11a_runtime.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden reclaimed update worker ownership"
          git push origin HEAD:feature/vp3-phase-11a-runtime-queue-hardening-20260729
