name: Apply Phase 11A Final Fixture Cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-phase11a-fixture-final
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/vp3-phase-11a-runtime-queue-hardening-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-11a-runtime-queue-hardening-20260729
          fetch-depth: 0
      - name: Apply final fixture cleanup
        run: |
          base64 -d .phase11a-fixture-final/payload.b64 | gzip -d > /tmp/phase11a-fixture-final.patch
          git apply --check /tmp/phase11a-fixture-final.patch
          git apply /tmp/phase11a-fixture-final.patch
          rm -rf .phase11a-fixture-final
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate Phase 11A recovery fixtures"
          git push origin HEAD:feature/vp3-phase-11a-runtime-queue-hardening-20260729
