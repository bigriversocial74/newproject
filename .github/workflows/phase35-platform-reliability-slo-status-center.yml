name: Phase 35 Platform Reliability SLO Status Center

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase35-vp3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VP3_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate JavaScript
        run: for file in public/assets/*.js; do node --check "$file"; done
      - name: Validate PHP ${{ matrix.php }} and Phase 35 contracts
        run: |
          docker run --rm \
            -e VP3_RELEASE_COMMIT="$VP3_RELEASE_COMMIT" \
            -v "$PWD:/app" -w /app php:${{ matrix.php }}-cli-bookworm sh -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends libonig-dev libzip-dev >/dev/null &&
              docker-php-ext-install -j2 pdo_mysql mbstring zip >/dev/null &&
              find src public tests config workers tools -name "*.php" -print0 | xargs -0 -n1 php -l &&
              php tools/build-single-install.php &&
              ! grep -Eq "^[[:space:]]*SOURCE[[:space:]]" database/vp3-single-install.sql &&
              php tests/phase30_security_audit_hardening_contract.php &&
              php tests/phase31_security_center_contract.php &&
              php tests/phase32_security_incident_automation_contract.php &&
              php tests/phase33_production_deployment_contract.php &&
              php tests/phase33_operator_controls_contract.php &&
              php tests/phase34_release_deployment_control_center_contract.php &&
              php tests/phase35_platform_reliability_slo_status_center_contract.php &&
              php tests/phase35_web_first_administrator_setup_contract.php
            '
      - name: Upload generated standalone installer
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vp3-phase35-single-install
          path: database/vp3-single-install.sql
          if-no-files-found: error
          retention-days: 7

  mysql8:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PHP and MySQL clients
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring php-zip mysql-client
          php -r '$required=["pdo","pdo_mysql","json","mbstring","openssl","sodium","zip"];foreach($required as $extension){if(!extension_loaded($extension)){fwrite(STDERR,"Missing {$extension}\n");exit(1);}}'
      - name: Generate and import standalone installer twice
        run: |
          php tools/build-single-install.php
          ! grep -Eq "^[[:space:]]*SOURCE[[:space:]]" database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < database/vp3-single-install.sql
      - name: Run Phase 35 MySQL certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_MYSQL_BINARY: /usr/bin/mysql
          VP3_TEST_MYSQLDUMP_BINARY: /usr/bin/mysqldump
        run: |
          php tests/phase30_security_audit_hardening_database_integration.php
          php tests/phase32_security_incident_automation_database_integration.php
          php tests/phase32_security_operations_database_integration.php
          php tests/phase32_assignment_replay_database_integration.php
          php tests/phase33_production_deployment_database_integration.php
          php tests/phase33_operator_controls_database_integration.php
          php tests/phase34_release_deployment_control_center_database_integration.php
          php tests/phase35_platform_reliability_slo_status_center_database_integration.php
          php tests/phase35_web_first_administrator_setup_database_integration.php

  mariadb1011:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PHP and MariaDB clients
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-mbstring php-zip mariadb-client
          php -r '$required=["pdo","pdo_mysql","json","mbstring","openssl","sodium","zip"];foreach($required as $extension){if(!extension_loaded($extension)){fwrite(STDERR,"Missing {$extension}\n");exit(1);}}'
      - name: Generate and import standalone installer twice
        run: |
          php tools/build-single-install.php
          ! grep -Eq "^[[:space:]]*SOURCE[[:space:]]" database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < database/vp3-single-install.sql
      - name: Run Phase 35 MariaDB certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
          VP3_TEST_MYSQL_BINARY: /usr/bin/mariadb
          VP3_TEST_MYSQLDUMP_BINARY: /usr/bin/mariadb-dump
        run: |
          php tests/phase30_security_audit_hardening_database_integration.php
          php tests/phase32_security_incident_automation_database_integration.php
          php tests/phase32_security_operations_database_integration.php
          php tests/phase32_assignment_replay_database_integration.php
          php tests/phase33_production_deployment_database_integration.php
          php tests/phase33_operator_controls_database_integration.php
          php tests/phase34_release_deployment_control_center_database_integration.php
          php tests/phase35_platform_reliability_slo_status_center_database_integration.php
          php tests/phase35_web_first_administrator_setup_database_integration.php

  commit-generated-installer:
    needs: [php, mysql8, mariadb1011]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Commit only the certified generated installer
        run: |
          php tools/build-single-install.php
          if git diff --quiet -- database/vp3-single-install.sql; then
            echo "The standalone installer is current."
            exit 0
          fi
          test "$(git diff --name-only | tr '\n' ' ')" = "database/vp3-single-install.sql "
          git config user.name "vp3-certification-bot"
          git config user.email "actions@users.noreply.github.com"
          git add database/vp3-single-install.sql
          git commit -m "Certify Phase 35 standalone SQL installer"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
