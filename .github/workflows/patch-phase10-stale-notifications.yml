name: Patch Phase 10 Stale Notifications

on:
  push:
    branches:
      - feature/vp3-phase-10-operations-readiness-20260729
    paths:
      - .github/workflows/patch-phase10-stale-notifications.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-phase-10-operations-readiness-20260729
      - name: Add stale notification recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('src/Operations/OperationalNotificationService.php')
          service = service_path.read_text()
          service_needle = """        $notification = $this->database->transaction(function (PDO $pdo) use ($workerId): ?array {\n            $claim = $pdo->query("""
          service_replacement = """        $notification = $this->database->transaction(function (PDO $pdo) use ($workerId): ?array {\n            $pdo->exec(\n                \"UPDATE operational_notifications\n                 SET status='queued',locked_at=NULL,locked_by=NULL,available_at=UTC_TIMESTAMP(),updated_at=UTC_TIMESTAMP()\n                 WHERE status='running' AND locked_at<DATE_SUB(UTC_TIMESTAMP(),INTERVAL 15 MINUTE)\"\n            );\n            $claim = $pdo->query("""
          if service_needle not in service:
              raise SystemExit('Notification claim insertion point was not found.')
          service_path.write_text(service.replace(service_needle, service_replacement, 1))

          test_path = Path('tests/phase10_database_integration.php')
          test = test_path.read_text()
          test_needle = """    $assert(($retrySuccess['status'] ?? null) === 'delivered', 'Queued notification retry was not delivered.');\n\n    $service->recordHealthSignal"""
          test_replacement = """    $assert(($retrySuccess['status'] ?? null) === 'delivered', 'Queued notification retry was not delivered.');\n    while ($service->processNextNotification('phase10-drain') !== null) {\n        $pdo->exec(\"UPDATE operational_notifications SET available_at=UTC_TIMESTAMP() WHERE status='queued'\");\n    }\n    $staleIncident = $service->openIncident($accountId, 'manual_test', 4, 'warning', 'Stale notification incident', ['token' => $token]);\n    $staleNotificationId = (int) $pdo->query(\n        'SELECT id FROM operational_notifications WHERE incident_id=' . $staleIncident['incident_id'] . ' ORDER BY id DESC LIMIT 1'\n    )->fetchColumn();\n    $pdo->exec(\n        \"UPDATE operational_notifications SET status='running',locked_at=DATE_SUB(UTC_TIMESTAMP(),INTERVAL 30 MINUTE),\n         locked_by='crashed-worker' WHERE id=\" . $staleNotificationId\n    );\n    $staleRecovered = $service->processNextNotification('phase10-recovery');\n    $assert(\n        ($staleRecovered['notification_id'] ?? null) === $staleNotificationId\n        && ($staleRecovered['status'] ?? null) === 'delivered',\n        'Stale claimed notification was not recovered and delivered.'\n    );\n\n    $service->recordHealthSignal"""
          if test_needle not in test:
              raise SystemExit('Phase 10 retry-test insertion point was not found.')
          test_path.write_text(test.replace(test_needle, test_replacement, 1))
          PY
          rm .github/workflows/patch-phase10-stale-notifications.yml
          git config user.name "vp3-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/Operations/OperationalNotificationService.php tests/phase10_database_integration.php .github/workflows/patch-phase10-stale-notifications.yml
          git commit -m "Recover stale Phase 10 notification claims"
          git push origin HEAD:feature/vp3-phase-10-operations-readiness-20260729
