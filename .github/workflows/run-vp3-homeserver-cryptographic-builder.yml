name: Run VP3 HomeServer Cryptographic Builder

on:
  pull_request:
    paths:
      - .github/workflows/run-vp3-homeserver-cryptographic-builder.yml
      - scripts/build-phase13-homeserver-contract-temp.py
      - scripts/repair-phase13-builder-temp.py
      - scripts/repair-phase13-test-temp.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-homeserver-cryptographic-contract-v1-20260729
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Repair deterministic builder
        run: |
          python scripts/repair-phase13-builder-temp.py
          python scripts/repair-phase13-test-temp.py
      - name: Build product tree
        run: python scripts/build-phase13-homeserver-contract-temp.py
      - name: Validate generated product tree
        run: |
          find src public tests config -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/phase12_homeserver_control_plane_contract.php
          php tests/phase13_homeserver_cryptographic_contract.php
      - name: Commit validated product files
        run: |
          rm .github/workflows/build-vp3-homeserver-cryptographic-contract.yml
          rm .github/workflows/run-vp3-homeserver-cryptographic-builder.yml
          rm scripts/build-phase13-homeserver-contract-temp.py
          rm scripts/repair-phase13-builder-temp.py
          rm scripts/repair-phase13-test-temp.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden VP3 HomeServer cryptographic contract"
          git push origin HEAD:feature/vp3-homeserver-cryptographic-contract-v1-20260729
