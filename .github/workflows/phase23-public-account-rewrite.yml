name: Phase 23 Public Account Rewrite

on:
  push:
    branches:
      - feature/vp3-phase-23-public-account-routing
    paths:
      - tools/phase23_public_account_rewrite.py
      - .github/workflows/phase23-public-account-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-phase-23-public-account-routing
          fetch-depth: 0
      - name: Apply public account identity rewrite
        run: python3 tools/phase23_public_account_rewrite.py
      - name: Validate JavaScript syntax
        run: |
          node --check public/assets/control-center.js
          node --check public/assets/billing-control-center.js
          node --check public/assets/homeserver-fleet.js
          node --check public/assets/homeserver-transfer-accept.js
          node --check public/assets/account-security.js
          node --check public/assets/operations-control-center.js
          node --check public/assets/recovery-control-center.js
          node --check public/assets/infrastructure-control-center.js
          node --check public/assets/federated-settings.js
      - name: Commit permanent browser boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets .github/workflows tools
          git commit -m "Complete Phase 23 public browser account identity boundary"
          git push origin HEAD:feature/vp3-phase-23-public-account-routing
