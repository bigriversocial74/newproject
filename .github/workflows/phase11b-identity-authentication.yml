name: Phase 11B Identity and Authentication Completion

on:
  push:
    branches:
      - main
      - feature/vp3-phase-11b-identity-completion
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase11b-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Validate Composer and runtime platform contract
        run: |
          composer validate --strict --no-check-publish
          php -r '$required = ["pdo", "pdo_mysql", "json", "mbstring", "openssl", "sodium"]; foreach ($required as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'
      - name: Validate PHP syntax
        run: find src public tests config workers -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run retained static certification
        run: |
          php tests/run.php
          php tests/phase3_contract.php
          php tests/phase4_contract.php
          php tests/phase5_contract.php
          php tests/phase6_contract.php
          php tests/phase7_contract.php
          php tests/phase8_contract.php
          php tests/phase9_contract.php
          php tests/phase10_contract.php
          php tests/phase11a_contract.php
          php tests/phase11a_runtime.php
      - name: Run Phase 11B static and runtime certification
        run: |
          php tests/phase11b_contract.php
          php tests/phase11b_runtime.php

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Import cumulative schema twice
        working-directory: database
        run: |
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Run retained database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/database-integration.php
          php tests/phase3_database_integration.php
          php tests/phase4_database_integration.php
          php tests/phase5_database_integration.php
          php tests/phase6_database_integration.php
          php tests/phase7_database_integration.php
          php tests/phase8_database_integration.php
          php tests/phase9_database_integration.php
          php tests/phase10_database_integration.php
          php tests/phase11a_database_integration.php
      - name: Run MySQL 8 Phase 11B certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: php tests/phase11b_database_integration.php

  mariadb1011:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Import cumulative schema twice
        working-directory: database
        run: |
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Run retained database certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: |
          php tests/database-integration.php
          php tests/phase3_database_integration.php
          php tests/phase4_database_integration.php
          php tests/phase5_database_integration.php
          php tests/phase6_database_integration.php
          php tests/phase7_database_integration.php
          php tests/phase8_database_integration.php
          php tests/phase9_database_integration.php
          php tests/phase10_database_integration.php
          php tests/phase11a_database_integration.php
      - name: Run MariaDB 10.11 Phase 11B certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: php tests/phase11b_database_integration.php
