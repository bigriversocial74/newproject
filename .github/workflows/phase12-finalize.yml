name: Finalize Phase 12 HomeServer Control Plane

on:
  push:
    branches:
      - feature/vp3-homeserver-control-plane-v1-20260729
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase12-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-homeserver-control-plane-v1-20260729
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Apply idempotent software-authority repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/HomeServers/HomeServerControlPlaneService.php')
          text = path.read_text()
          old_call = "$this->revokeDeviceAuthority($pdo, (int) $device['id']);"
          new_call = "$this->revokeSoftwareAuthority($pdo, (int) $device['id']);"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('Suspension authority call was not found')

          marker = "    private function revokeDeviceAuthority(PDO $pdo, int $deviceId): void\n"
          helper_signature = "    private function revokeSoftwareAuthority(PDO $pdo, int $deviceId): void\n"
          helper = """    private function revokeSoftwareAuthority(PDO $pdo, int $deviceId): void
    {
        $pdo->prepare(\"UPDATE homeserver_entitlement_leases SET status='revoked',revoked_at=UTC_TIMESTAMP() WHERE device_id=:device AND status='active'\")
            ->execute(['device' => $deviceId]);
        $pdo->prepare(\"UPDATE homeserver_installer_grants SET status='revoked',revoked_at=UTC_TIMESTAMP() WHERE device_id=:device AND status='active'\")
            ->execute(['device' => $deviceId]);
    }

"""
          if helper_signature not in text:
              if marker not in text:
                  raise SystemExit('Full device authority helper marker was not found')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY
      - name: Validate final product tree
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/phase12_homeserver_control_plane_contract.php
          grep -F 'revokeSoftwareAuthority($pdo' src/HomeServers/HomeServerControlPlaneService.php
          grep -F 'revokeDeviceAuthority($pdo' src/HomeServers/HomeServerControlPlaneService.php
      - name: Remove temporary workflows and push safely
        run: |
          rm -f .github/workflows/phase12-finalize.yml
          rm -f .github/workflows/phase12-authority-boundary-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/HomeServers/HomeServerControlPlaneService.php .github/workflows/phase12-finalize.yml .github/workflows/phase12-authority-boundary-repair.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize VP3 HomeServer authority boundaries"
          for attempt in 1 2 3; do
            if git push origin HEAD:feature/vp3-homeserver-control-plane-v1-20260729; then
              exit 0
            fi
            git pull --rebase origin feature/vp3-homeserver-control-plane-v1-20260729
          done
          exit 1
