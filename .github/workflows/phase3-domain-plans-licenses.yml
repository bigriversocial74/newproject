name: Phase 3 Domain Plans and Licenses

on:
  pull_request:
  push:
    branches:
      - feature/vp3-phase-3-domain-plans-licenses-20260729

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, json, mbstring
          coverage: none
      - name: Validate PHP syntax
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run retained Phase 2 tests
        run: php tests/run.php
      - name: Run Phase 3 static contract certification
        run: php tests/phase3_contract.php
      - name: Validate cumulative installer
        run: |
          grep -q '20260729_phase3_domain_plans_licenses.sql' database/vp3-single-install.sql
          grep -q 'CREATE TABLE IF NOT EXISTS domain_registrations' database/migrations/20260729_phase3_domain_plans_licenses.sql
          grep -q 'CREATE TABLE IF NOT EXISTS entitlement_bundles' database/migrations/20260729_phase3_domain_plans_licenses.sql
          grep -q 'CREATE TABLE IF NOT EXISTS licenses' database/migrations/20260729_phase3_domain_plans_licenses.sql
          grep -q "'security_update_access'" database/migrations/20260729_phase3_domain_plans_licenses.sql

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vp3_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring
          coverage: none
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Import cumulative schema twice
        working-directory: database
        run: |
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
          mysql -h 127.0.0.1 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Run MySQL 8 Phase 3 certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: php tests/phase3_database_integration.php

  mariadb1011:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vp3_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, json, mbstring
          coverage: none
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Import cumulative schema twice
        working-directory: database
        run: |
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
          mariadb -h 127.0.0.1 -P 3307 -uroot -proot vp3_test < vp3-single-install.sql
      - name: Run MariaDB 10.11 Phase 3 certification
        env:
          VP3_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=vp3_test;charset=utf8mb4
          VP3_TEST_DB_USER: root
          VP3_TEST_DB_PASSWORD: root
        run: php tests/phase3_database_integration.php
