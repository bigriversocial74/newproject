name: Integrate Phase 12 HomeServer Control Plane

on:
  push:
    branches:
      - feature/vp3-homeserver-control-plane-v1-20260729
    paths:
      - .github/workflows/phase12-integrate.yml
  pull_request:
    paths:
      - .github/workflows/phase12-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-homeserver-control-plane-v1-20260729
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, mbstring, sodium, openssl
          coverage: none
      - name: Apply retained registry compatibility repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/HomeServers/HomeServerRegistryService.php')
          text = path.read_text()
          old = "SELECT id,public_id FROM homeserver_devices WHERE license_id=:license OR device_fingerprint=:fingerprint LIMIT 1 FOR UPDATE"
          new = "SELECT id,public_id FROM homeserver_devices WHERE (license_id=:license OR device_fingerprint=:fingerprint) AND status<>'revoked' LIMIT 1 FOR UPDATE"
          if old not in text and new not in text:
              raise SystemExit('Expected HomeServer registry query was not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Validate integration
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/phase12_homeserver_control_plane_contract.php
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/phase12-integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/HomeServers/HomeServerRegistryService.php .github/workflows/phase12-integrate.yml
          git commit -m "Integrate HomeServer replacement compatibility"
          git push origin HEAD:feature/vp3-homeserver-control-plane-v1-20260729
