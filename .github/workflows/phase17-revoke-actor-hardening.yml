name: Phase 17 Revoke Actor Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'feature/vp3-phase-17-account-team-security-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-phase-17-account-team-security-control
          fetch-depth: 0
      - name: Revalidate invitation-revocation actor in transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service = Path('src/Auth/TeamSecurityService.php')
          text = service.read_text()
          old = """    public function revokeInvitation(int $accountId, int $actorUserId, string $publicId, string $requestId): void
              {
                  $this->database->transaction(function (PDO $pdo) use ($accountId, $actorUserId, $publicId, $requestId): void {
                      $nowText = (new DateTimeImmutable('now'))->format('Y-m-d H:i:s');
          """
          new = """    public function revokeInvitation(int $accountId, int $actorUserId, string $actorRole, string $publicId, string $requestId): void
              {
                  $this->database->transaction(function (PDO $pdo) use ($accountId, $actorUserId, $actorRole, $publicId, $requestId): void {
                      $this->assertActor($pdo, $accountId, $actorUserId, $actorRole);
                      $nowText = (new DateTimeImmutable('now'))->format('Y-m-d H:i:s');
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one revoke service anchor, found {text.count(old)}')
          service.write_text(text.replace(old, new, 1))

          endpoint = Path('public/api/control-center/v1/team-action.php')
          text = endpoint.read_text()
          old = """        $service->revokeInvitation(
                      $account['account_id'],
                      (int) $account['user']['id'],
                      (string) ($payload['invitation_public_id'] ?? ''),
                      $requestId
                  );
          """
          new = """        $service->revokeInvitation(
                      $account['account_id'],
                      (int) $account['user']['id'],
                      $account['role'],
                      (string) ($payload['invitation_public_id'] ?? ''),
                      $requestId
                  );
          """
          if text.count(old) != 1:
              raise SystemExit(f'Expected one revoke endpoint anchor, found {text.count(old)}')
          endpoint.write_text(text.replace(old, new, 1))

          contract = Path('tests/phase17_account_team_security_contract.php')
          text = contract.read_text()
          anchor = "$assert(str_contains($team, 'private function assertActor') && str_contains($team, \"status='active' LIMIT 1 FOR UPDATE\"), 'Team mutations do not revalidate the active actor membership.');"
          replacement = anchor + "\n$assert(str_contains($team, 'revokeInvitation(int $accountId, int $actorUserId, string $actorRole') && str_contains($team, '$this->assertActor($pdo, $accountId, $actorUserId, $actorRole);'), 'Invitation revocation does not revalidate the active actor role in its transaction.');"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one actor contract anchor, found {text.count(anchor)}')
          contract.write_text(text.replace(anchor, replacement, 1))
          PY
          php -l src/Auth/TeamSecurityService.php
          php -l public/api/control-center/v1/team-action.php
          php -l tests/phase17_account_team_security_contract.php
          rm -f .github/workflows/phase17-revoke-actor-hardening.yml
          git config user.name "VP3 Phase 17 Actor Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Revalidate invitation revocation actor"
          git push origin HEAD:feature/vp3-phase-17-account-team-security-control
